name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: python -m pip install 'PyYAML==6.0.2' 'ansible-core==2.17.14'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Python syntax
        run: python -m compileall -q app scripts tests
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Validate YAML syntax
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import yaml
          for path in list(Path('workflows').glob('*.yaml')) + list(Path('playbooks').glob('*.yml')) + list(Path('group_vars').glob('*.yml')):
              yaml.safe_load(path.read_text())
              print(f'validated {path}')
          PYCODE
      - name: Build the benign initramfs in CI (never boot a guest)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static cpio
          sudo install -d -m 0755 /usr/local/lib/slipcage
          sudo bash scripts/build-microguest.sh
          gzip -t /usr/local/lib/slipcage/microguest.cpio.gz
          gzip -dc /usr/local/lib/slipcage/microguest.cpio.gz | cpio -t 2>/dev/null | grep -Fx './init'
          gzip -dc /usr/local/lib/slipcage/microguest.cpio.gz | cpio -t 2>/dev/null | grep -Fx './dev/console'
      - name: Validate Ansible syntax
        run: ansible-playbook -i inventory/hosts.ini.example playbooks/site.yml --syntax-check
