name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: python -m pip install 'PyYAML==6.0.2' 'ansible-core==2.17.14'
      - name: Install offline contract engine
        run: python -m pip install -e .
      - name: Smoke test experiment definition validation (no execution)
        run: |
          slipcage --version
          slipcage validate examples/experiments/rbac-pod-create-denied.yaml --json
          slipcage run-fixture examples/experiments/rbac-pod-create-denied.yaml --scenario denied --json
          fixture_scratch="$(mktemp -d)"
          slipcage bundle-fixture examples/experiments/rbac-pod-create-denied.yaml --scenario denied --output "$fixture_scratch/bundle" --json
          slipcage verify-bundle "$fixture_scratch/bundle" --json
          slipcage bundle-fixture examples/experiments/rbac-pod-create-denied.yaml --scenario allowed --output "$fixture_scratch/candidate" --json
          python - "$fixture_scratch/bundle" "$fixture_scratch/candidate" <<'PYCODE'
          import json
          import subprocess
          import sys

          result = subprocess.run(
              ["slipcage", "compare-fixtures", sys.argv[1], sys.argv[2], "--json"],
              capture_output=True, text=True, check=False,
          )
          assert result.returncode == 1, (result.returncode, result.stderr)
          comparison = json.loads(result.stdout)
          assert comparison["classification"] == "regression", comparison
          assert comparison["comparison_status"] == "comparable"
          assert comparison["simulated"] is True
          assert comparison["security_test_executed"] is False
          assert comparison["real_security_evidence_verified"] is False
          PYCODE
          python - "$fixture_scratch" <<'PYCODE'
          import json
          from pathlib import Path
          import subprocess
          import sys

          scratch = Path(sys.argv[1])
          output = scratch / "integrated-proof"
          spec = "examples/experiments/rbac-pod-create-denied.yaml"
          cmd = ["slipcage", "demo-fixtures", spec,
                 "--baseline-scenario", "denied",
                 "--candidate-scenario", "allowed",
                 "--output", str(output), "--json"]
          created = subprocess.run(cmd, capture_output=True, text=True, check=False)
          assert created.returncode == 1, (created.returncode, created.stderr)
          data = json.loads(created.stdout)
          assert data["classification"] == "regression"
          assert data["simulated"] is True
          assert data["real_security_evidence_verified"] is False

          verified = subprocess.run(
              ["slipcage", "verify-demo", str(output), "--json"],
              capture_output=True, text=True, check=False,
          )
          assert verified.returncode == 1, (verified.returncode, verified.stderr)
          assert json.loads(verified.stdout) == data
          report = subprocess.run(
              ["slipcage", "report-fixtures", str(output / "baseline"),
               str(output / "candidate"), "--format", "markdown"],
              capture_output=True, text=True, check=False,
          )
          assert report.returncode == 1, (report.returncode, report.stderr)
          assert report.stdout.encode() == (output / "report.md").read_bytes()
          assert "OFFLINE SIMULATION ONLY" in report.stdout
          PYCODE
          python - <<'PYCODE'
          import json
          import subprocess

          proc = subprocess.run([
              "slipcage", "plan-vm", "examples/vm-plans/k3s-synthetic-design.json",
              "--inventory", "examples/vm-plans/host-capacity-synthetic.json",
              "--json",
          ], capture_output=True, text=True, check=False)
          assert proc.returncode == 0, (proc.returncode, proc.stderr)
          result = json.loads(proc.stdout)
          assert result["capacity_result"] == "fits_reported_capacity"
          assert result["status"] == "design_only"
          assert result["pin_status"] == "synthetic_fixture"
          assert result["artifacts_verified"] is False
          assert result["execution_authorized"] is False
          assert result["kvm_verified_on_target_host"] is False
          assert result["k3s_boot_verified"] is False
          assert result["vm_launched"] is False
          PYCODE
          python - <<'PYCODE'
          import json
          import subprocess

          path = "examples/vm-plans/k3s-synthetic-design.json"
          cases = [
              (["simulate-vm-lifecycle", path, "--scenario", "success", "--json"], 0),
              (["simulate-vm-lifecycle", path, "--scenario", "timeout", "--json"], 4),
              (["simulate-vm-lifecycle", path, "--scenario", "cleanup_failure", "--json"], 5),
              (["simulate-vm-pair", path, "--baseline-scenario", "success",
                "--candidate-scenario", "success", "--json"], 0),
              (["simulate-vm-pair", path, "--baseline-scenario", "cleanup_failure",
                "--candidate-scenario", "success", "--json"], 5),
          ]
          for args, expected in cases:
              process = subprocess.run(["slipcage", *args], capture_output=True,
                                       text=True, check=False)
              assert process.returncode == expected, (args, process.stderr)
              obj = json.loads(process.stdout)
              assert obj["simulated"] is True, obj
              assert obj["execution_authorized"] is False
              assert obj["real_vm_booted"] is False
              assert obj["host_storage_modified"] is False
              assert obj["cleanup_verified_on_host"] is False
              if args[0] == "simulate-vm-pair" and "cleanup_failure" in args:
                  assert obj["candidate_attempted"] is False
          PYCODE
          python - <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import tempfile

          names = {
              "os_image_sha256": "os-image.qcow2",
              "kernel_sha256": "kernel.bin",
              "k3s_binary_sha256": "k3s.bin",
              "cni_assets_sha256": "cni-assets.tar",
              "container_images_sha256": "container-images.tar",
          }
          with tempfile.TemporaryDirectory() as scratch:
              root = Path(scratch)
              assets = root / "assets"
              assets.mkdir(mode=0o700)
              assets.chmod(0o700)
              design = json.loads(Path(
                  "examples/vm-plans/k3s-synthetic-design.json"
              ).read_text(encoding="utf-8"))
              design["provenance"]["pin_status"] = "operator_supplied_unverified"
              design["provenance"]["note"] = "CI byte-only test, no verified software"
              design["software"]["guest_kernel_release"] = "6.8.0-test"
              for field, filename in names.items():
                  data = ("CI-only test bytes: " + field).encode("ascii")
                  child = assets / filename
                  child.write_bytes(data)
                  child.chmod(0o600)
                  design["artifacts"][field] = hashlib.sha256(data).hexdigest()
              path = root / "test-plan.json"
              path.write_text(json.dumps(design), encoding="utf-8")
              result = subprocess.run(
                  ["slipcage", "verify-vm-artifacts", str(path),
                   "--directory", str(assets), "--json"],
                  capture_output=True, text=True, check=False,
              )
              assert result.returncode == 0, (result.returncode, result.stderr)
              record = json.loads(result.stdout)
              assert record["content_sha256_matches_declared_pins"] is True
              for field in ("software_origin_authenticated", "execution_authorized",
                            "vm_launched", "guest_boot_verified", "host_modified"):
                  assert record[field] is False, (field, record)
              test_sample = subprocess.run(
                  ["slipcage", "verify-vm-artifacts",
                   "examples/vm-plans/k3s-synthetic-design.json",
                   "--directory", str(assets), "--json"],
                  capture_output=True, text=True, check=False,
              )
              assert test_sample.returncode == 2
              assert not test_sample.stdout
          PYCODE
          # SC-13b2 checks use ephemeral test keys and synthetic snapshots only.
          # No real publishers, VPS probes or guests are contacted.
          python -m unittest discover -s tests -p 'test_vm_provenance_host.py' -q
          # Synthetic fixtures/mocks only; never probe CI host or run any VM.
          python -m unittest discover -s tests -p 'test_vm_host_observe.py' -q
          # Fixed, incomplete QEMU argv blueprint; no QEMU launch or disk creation.
          python -m unittest discover -s tests -p 'test_vm_qemu_blueprint.py' -q
          # SC-13b5 pure in-memory state machine; no OS lock, VM or overlay.
          python -m unittest discover -s tests -p 'test_vm_supervision.py' -q
          # SC-13b6 file-backed reservation tests write only to isolated ephemeral temp roots.
          # No VM launch, disk overlay, VPS access or production file changes.
          python -m unittest discover -s tests -p 'test_vm_reservation.py' -q
          # SC-13b7 tiny hand-built QCOW2 header shapes in runner scratch, NEVER qemu-img/QEMU.
          python -m unittest discover -s tests -p 'test_vm_overlay_preflight.py' -q
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Python syntax
        run: python -m compileall -q app scripts src tests
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Validate YAML syntax
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import yaml
          for path in list(Path('workflows').glob('*.yaml')) + list(Path('playbooks').glob('*.yml')) + list(Path('group_vars').glob('*.yml')):
              yaml.safe_load(path.read_text())
              print(f'validated {path}')
          PYCODE
      - name: Build the benign initramfs in CI (never boot a guest)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static cpio
          sudo install -d -m 0755 /usr/local/lib/slipcage
          sudo bash scripts/build-microguest.sh
          gzip -t /usr/local/lib/slipcage/microguest.cpio.gz
          # cpio lists these paths without ./ on Ubuntu 24.04.
          contents="$(gzip -dc /usr/local/lib/slipcage/microguest.cpio.gz | cpio -it 2>/dev/null)"
          printf '%s\n' "$contents"
          printf '%s\n' "$contents" | grep -Fx init
          printf '%s\n' "$contents" | grep -Fx dev/console
      - name: Build and inspect fixed experiment guest without booting
        run: |
          sudo bash scripts/build-experiment-guest.sh
          gzip -t /usr/local/lib/slipcage/experiment-v1.cpio.gz
          contents="$(gzip -dc /usr/local/lib/slipcage/experiment-v1.cpio.gz | cpio -it 2>/dev/null)"
          printf '%s\n' "$contents" | grep -Fx init
          printf '%s\n' "$contents" | grep -Fx dev/console
          gzip -dc /usr/local/lib/slipcage/experiment-v1.cpio.gz | cpio -i --to-stdout init | sh -n
      - name: Validate Ansible syntax
        run: ansible-playbook -i inventory/hosts.ini.example playbooks/site.yml --syntax-check
