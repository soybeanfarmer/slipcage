name: Approve Slipcage Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v0.1.0)'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: slipcage-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must be vMAJOR.MINOR.PATCH"; exit 1;
          }
      - name: Validate source
        run: |
          python -m pip install 'PyYAML==6.0.2' 'ansible-core==2.17.14'
          python -m pip install -e .
          slipcage validate examples/experiments/rbac-pod-create-denied.yaml --json
          python -m unittest discover -s tests -v
          python -m compileall -q app scripts src tests
          bash -n scripts/*.sh
          ansible-playbook -i inventory/hosts.ini.example playbooks/site.yml --syntax-check
      - name: Publish approved release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Approved Slipcage release $RELEASE_TAG. Deployment is pulled by the ServaRica systemd timer after GitHub CI verification."
