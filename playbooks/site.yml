---
- name: Install isolated vulnerability research control plane
  hosts: research
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"

  pre_tasks:
    - name: Require Ubuntu 24.04 x86-64
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
          - ansible_facts['architecture'] == 'x86_64'
        fail_msg: "Use the Ubuntu 24.04 LTS x86-64 image; adjust and test for other platforms."

    - name: Detect existing Dagu installation
      ansible.builtin.stat:
        path: /etc/systemd/system/isolab-dagu.service
      register: existing_dagu

    - name: Detect deployment barrier
      ansible.builtin.stat:
        path: /usr/local/bin/slipcage-guard
      register: existing_guard

    - name: Refuse unsafe unattended migration from unguarded Dagu
      ansible.builtin.assert:
        that:
          - (not existing_dagu.stat.exists) or existing_guard.stat.exists
        fail_msg: "Existing Dagu has no deployment barrier. Drain manually before migrating."

    - name: Enter maintenance and drain guarded research jobs
      ansible.builtin.command:
        argv:
          - /usr/local/bin/slipcage-guard
          - begin
          - --wait-seconds
          - "{{ deploy_drain_seconds | string }}"
      when: existing_guard.stat.exists
      changed_when: true

  tasks:
    - name: Install core packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - python3
          - python3-venv
          - python3-pip
          - restic
          - busybox-static
          - cpio
          - sqlite3
          - jq
          - unzip
          - tar
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create deployment state directory
      ansible.builtin.file:
        path: /var/lib/slipcage
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create root-owned deployment lock
      ansible.builtin.file:
        path: /var/lib/slipcage/deployment.lock
        state: touch
        owner: root
        group: root
        mode: '0644'
        modification_time: preserve
        access_time: preserve

    - name: Install deployment barrier
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-guard.py"
        dest: /usr/local/bin/slipcage-guard
        owner: root
        group: root
        mode: '0755'

    - name: Install optional QEMU analysis and build tools
      ansible.builtin.apt:
        name:
          - clang
          - gcc
          - g++
          - make
          - ninja-build
          - meson
          - pkg-config
          - libglib2.0-dev
          - libpixman-1-dev
          - qemu-system-x86
          - qemu-utils
          - gdb
        state: present
      when: install_research_toolchain | bool

    - name: Create locked-down research group
      ansible.builtin.group:
        name: "{{ research_group }}"
        system: true

    - name: Create unprivileged research user
      ansible.builtin.user:
        name: "{{ research_user }}"
        group: "{{ research_group }}"
        shell: /usr/sbin/nologin
        home: /var/lib/isolab
        create_home: false
        system: true
        password_lock: true

    - name: Ensure KVM device-access group exists
      ansible.builtin.group:
        name: kvm
        system: true

    - name: Create dedicated VM probe group
      ansible.builtin.group:
        name: slipcage-vmprobe
        system: true

    - name: Create isolated, unprivileged VM probe account
      ansible.builtin.user:
        name: slipcage-vmprobe
        group: slipcage-vmprobe
        groups: kvm
        append: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false
        system: true
        password_lock: true

    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: '/opt/isolab', owner: 'root', group: 'root', mode: '0755' }
        - { path: '/opt/isolab/app', owner: 'root', group: 'root', mode: '0755' }
        - { path: '/opt/isolab/vendor', owner: 'root', group: 'root', mode: '0755' }
        - { path: '/srv/isolab', owner: 'isolab', group: 'isolab', mode: '0700' }
        - { path: '/srv/isolab/reports', owner: 'isolab', group: 'isolab', mode: '0700' }
        - { path: '/var/lib/dagu', owner: 'isolab', group: 'isolab', mode: '0700' }
        - { path: '/var/lib/dagu/dags', owner: 'isolab', group: 'isolab', mode: '0700' }
        - { path: '/var/lib/dagu/data', owner: 'isolab', group: 'isolab', mode: '0700' }
        - { path: '/var/lib/dagu/logs', owner: 'isolab', group: 'isolab', mode: '0700' }

    - name: Download and verify pinned Dagu release
      ansible.builtin.get_url:
        url: "https://github.com/dagucloud/dagu/releases/download/v{{ dagu_version }}/dagu_{{ dagu_version }}_linux_amd64.tar.gz"
        dest: "/opt/isolab/vendor/dagu_{{ dagu_version }}.tar.gz"
        checksum: "sha256:{{ dagu_archive_sha256 }}"
        owner: root
        group: root
        mode: '0644'

    - name: Create pinned binary extraction folder
      ansible.builtin.file:
        path: "/opt/isolab/vendor/dagu-{{ dagu_version }}"
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Extract Dagu
      ansible.builtin.unarchive:
        src: "/opt/isolab/vendor/dagu_{{ dagu_version }}.tar.gz"
        dest: "/opt/isolab/vendor/dagu-{{ dagu_version }}"
        remote_src: true
        creates: "/opt/isolab/vendor/dagu-{{ dagu_version }}/dagu"

    - name: Install Dagu binary
      ansible.builtin.copy:
        src: "/opt/isolab/vendor/dagu-{{ dagu_version }}/dagu"
        remote_src: true
        dest: /usr/local/bin/dagu
        mode: '0755'
        owner: root
        group: root
      notify: Restart Dagu

    - name: Install research intelligence module
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/intelligence.py"
        dest: /opt/isolab/app/intelligence.py
        owner: root
        group: root
        mode: '0644'

    - name: Install review attempt and recovery module
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/recovery.py"
        dest: /opt/isolab/app/recovery.py
        owner: root
        group: root
        mode: '0644'

    - name: Install reviewed research coordinator code
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/isolab.py"
        dest: /opt/isolab/app/isolab.py
        owner: root
        group: root
        mode: '0755'

    - name: Create application helper scripts directory
      ansible.builtin.file:
        path: /opt/isolab/scripts
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install reviewed discovery script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/discover.sh"
        dest: /opt/isolab/scripts/discover.sh
        owner: root
        group: root
        mode: '0755'

    - name: Install server verification helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/verify-server.sh"
        dest: /opt/isolab/verify-server.sh
        owner: root
        group: root
        mode: '0755'

    - name: Deploy Dagu configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/dagu-config.yaml.j2"
        dest: /var/lib/dagu/config.yaml
        owner: isolab
        group: isolab
        mode: '0600'
      notify: Restart Dagu

    - name: Deploy reviewed workflows
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../workflows/"
        dest: /var/lib/dagu/dags/
        owner: isolab
        group: isolab
        mode: '0600'
      notify: Restart Dagu

    - name: Deploy Dagu systemd service
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/dagu.service.j2"
        dest: /etc/systemd/system/isolab-dagu.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart Dagu

    - name: Enable Dagu service
      ansible.builtin.systemd_service:
        name: isolab-dagu.service
        daemon_reload: true
        enabled: true
        state: started

    - name: Apply all pending service restarts before resuming
      ansible.builtin.meta: flush_handlers

    - name: Verify Dagu is active
      ansible.builtin.command: systemctl is-active isolab-dagu.service
      changed_when: false

    - name: Check Dagu version
      ansible.builtin.command: /usr/local/bin/dagu version
      changed_when: false
      register: dagu_version_result

    - name: Create private on-server backup directory
      ansible.builtin.file:
        path: /var/backups/slipcage
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install validated backup helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-backup.py"
        dest: /usr/local/sbin/slipcage-backup
        owner: root
        group: root
        mode: '0755'

    - name: Install hardened backup systemd service
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-backup.service"
        dest: /etc/systemd/system/slipcage-backup.service
        owner: root
        group: root
        mode: '0644'

    - name: Install daily backup timer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-backup.timer"
        dest: /etc/systemd/system/slipcage-backup.timer
        owner: root
        group: root
        mode: '0644'

    - name: Enable scheduled Slipcage backups
      ansible.builtin.systemd_service:
        name: slipcage-backup.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Install non-destructive restore drill tool
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-restore-check.py"
        dest: /usr/local/sbin/slipcage-restore-check
        owner: root
        group: root
        mode: '0755'

    - name: Deploy guarded review recovery unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-recover.service"
        dest: /etc/systemd/system/slipcage-recover.service
        owner: root
        group: root
        mode: '0644'

    - name: Deploy review recovery timer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-recover.timer"
        dest: /etc/systemd/system/slipcage-recover.timer
        owner: root
        group: root
        mode: '0644'

    - name: Enable review recovery timer
      ansible.builtin.systemd_service:
        name: slipcage-recover.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Create root-owned readiness script directory
      ansible.builtin.file:
        path: /usr/local/lib/slipcage
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install reproducible microguest initramfs builder
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/build-microguest.sh"
        dest: /usr/local/lib/slipcage/build-microguest
        owner: root
        group: root
        mode: '0755'

    - name: Build a disposable, networkless initramfs from distro busybox-static
      ansible.builtin.command:
        argv:
          - /usr/local/lib/slipcage/build-microguest
        creates: /usr/local/lib/slipcage/microguest.cpio.gz

    - name: Stage running Ubuntu kernel for unprivileged microguest boot
      ansible.builtin.copy:
        src: "/boot/vmlinuz-{{ ansible_facts['kernel'] }}"
        dest: "/usr/local/lib/slipcage/vmlinuz-{{ ansible_facts['kernel'] }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'

    - name: Install KVM readiness probe (manual only)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-kvm-probe.py"
        dest: /usr/local/lib/slipcage/kvm-probe.py
        owner: root
        group: root
        mode: '0755'

    - name: Install sandboxed manual KVM probe unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-kvm-probe.service"
        dest: /etc/systemd/system/slipcage-kvm-probe.service
        owner: root
        group: root
        mode: '0644'

    - name: Install sandboxed, manual microguest boot unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-kvm-boot.service"
        dest: /etc/systemd/system/slipcage-kvm-boot.service
        owner: root
        group: root
        mode: '0644'

    - name: Restrict offsite-credential directory
      ansible.builtin.file:
        path: /etc/slipcage
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install opt-in encrypted offsite backup runner
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/slipcage-offsite-backup.sh"
        dest: /usr/local/sbin/slipcage-offsite-backup
        owner: root
        group: root
        mode: '0750'

    - name: Install disabled-by-default encrypted backup service
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-offsite-backup.service"
        dest: /etc/systemd/system/slipcage-offsite-backup.service
        owner: root
        group: root
        mode: '0644'

    - name: Install disabled-by-default encrypted backup timer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/slipcage-offsite-backup.timer"
        dest: /etc/systemd/system/slipcage-offsite-backup.timer
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd for opt-in units without enabling them
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Release deployment maintenance after health checks
      ansible.builtin.command: /usr/local/bin/slipcage-guard end
      when: existing_guard.stat.exists
      changed_when: true

    - name: Display final message
      ansible.builtin.debug:
        msg:
          - "Dagu installed: {{ dagu_version_result.stdout }}"
          - "Open an SSH tunnel: ssh -L 8525:127.0.0.1:8525 ubuntu@YOUR_SERVER_IP"
          - "Then visit http://127.0.0.1:8525/setup and create the admin."
          - "No external dashboard port is opened; no Docker socket is mounted."

  handlers:
    - name: Restart Dagu
      ansible.builtin.systemd_service:
        name: isolab-dagu.service
        daemon_reload: true
        state: restarted
