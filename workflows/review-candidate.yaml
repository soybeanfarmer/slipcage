name: review-candidate
queue: research
timeout_sec: 240
params:
  - name: candidate_id
    type: string
    required: true
steps:
  - id: report
    # Parameter IDs are validated as SHA-256 hex by the application.
    run: /usr/bin/python3 /opt/isolab/app/isolab.py report --db /srv/isolab/research.sqlite3 --output /srv/isolab/reports --id "${params.candidate_id}"
